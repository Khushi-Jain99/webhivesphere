<section id="projects" class="projects" appReveal>
  <div class="projects-inner">
    <app-section-heading
      eyebrow="Projects"
      title="Selected work delivered with strategy and precision"
      description="A curated collection of product interfaces designed for clarity, growth, and measurable impact."
    ></app-section-heading>

    <div class="projects-grid">
      @for (project of projects; track project.name) {
        <article class="project-card" appReveal>
          <div class="project-glow bg-gradient-to-br {{ project.gradient }}"></div>
          
          <div class="project-meta">
            <span>{{ project.year }}</span>
            <span>{{ project.impact }}</span>
          </div>
          <h3>{{ project.name }}</h3>
          <p>{{ project.summary }}</p>
          <div class="project-tags">
            @for (tag of project.tags; track tag) {
              <span>{{ tag }}</span>
            }
          </div>
          
          <div class="project-footer">
            <a [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="project-link">
              <span>Live Link</span>
              <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
              </svg>
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
